name: Build and package GREETING component

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mysql-component-ci/.github/workflows/build-component.yml@main
    with:
      component_name: greeting
      component_directory: greeting
      build_target: component_greeting
      component_library: component_greeting.so

      sdk_image: quay.io/lefred14/mysql-component-build
      mysql_versions: |
          9.7.2
          26.7.0

      run_tests: false

